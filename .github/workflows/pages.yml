name: Publish portfolio
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Index lab folders
        run: python scripts/build_content.py
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html _site/
          cp about.html projects.html labs.html content-index.json _site/
          cp -R content _site/
          if [ -d assets ]; then cp -R assets _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
